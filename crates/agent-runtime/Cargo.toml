[package]
name = "tidy-agent-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tidy-organization = { path = "../organization" }
tidy-storage = { path = "../storage" }

[[bin]]
name = "tidy-ai"
path = "src/main.rs"

[dev-dependencies]
tidy-file-indexer = { path = "../file-indexer" }
tidy-platform = { path = "../platform" }

[[test]]
name = "phase4_contract"
path = "../../tests/phase4_contract.rs"

