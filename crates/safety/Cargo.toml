[package]
name = "tidy-safety"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tidy-platform = { path = "../platform" }
tidy-organization = { path = "../organization" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
trash = "5.2"
sha2 = "0.10"

[[test]]
name = "phase5_contract"
path = "../../tests/phase5_contract.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }
